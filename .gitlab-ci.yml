image: python:3.12

stages:
  - build

variables:
  GIT_DEPTH: "5"
  PYTHONDONTWRITEBYTECODE: "1"

daily_autonomous_lab:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  timeout: 15m
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install google-genai pytest
    - git config --global user.name "Jasper AI Autopilot"
    - git config --global user.email "salomh46@gmail.com"
  script:
    - python .github/scripts/daily_builder.py
    - git status
    - |
      if git diff --quiet && git diff --staged --quiet; then
        echo "No changes detected. Workspace is clean."
      else
        BUILD_MSG=$(cat .github/scripts/latest_commit_msg.txt 2>/dev/null || echo "feat(ai-lab): autonomous daily open-source tool build & verified tests")
        git add .
        git commit -m "$BUILD_MSG [skip ci]"
        if [ -n "$GITLAB_TOKEN" ]; then
          git push https://oauth2:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git HEAD:${CI_DEFAULT_BRANCH}
        else
          git push https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git HEAD:${CI_DEFAULT_BRANCH} || echo "Please ensure GITLAB_TOKEN is set in CI/CD variables if push fails."
        fi
      fi
